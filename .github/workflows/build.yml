name: build
on: [push, pull_request]
jobs:
  x86-and-selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake g++ libsdl2-dev libasound2-dev
      - name: Build + selftest (x86_64)
        run: |
          cmake -S . -B build-x86_64 -DCMAKE_BUILD_TYPE=Release
          cmake --build build-x86_64 -j"$(nproc)"
          ./build-x86_64/t8_selftest
