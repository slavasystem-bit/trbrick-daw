name: build
# Every pull request and every change to main runs this. The TR-Brick button on the Mac
# (tools/mac/launch.sh) refuses to start a pull request whose checks failed (still running = warns), and
# main is protected: a pull request can be merged only when these checks pass.
# A pull request that changes only documents (*.md, docs/) still runs this workflow, but the
# build jobs show as "skipped" (which counts as passed): no need to build for text.
# A newer push to the same pull request or to main cancels the older run.
on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: What changed (documents only = no build)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Documents have no unresolved merge conflict markers
        run: |
          if git grep -nE '^(<<<<<<<|>>>>>>>) ' -- '*.md' 'docs/'; then
            echo "a document still has merge conflict markers"; exit 1
          fi
      - name: Changelog entries are in changelog.d/, not at the top of CHANGELOG.md
        run: |
          tools/changelog.sh check
          if [ "${{ github.event_name }}" = pull_request ]; then
            # only a release PR (tools/changelog.sh release: it also deletes fragments) may edit CHANGELOG.md
            if git diff --name-only HEAD^1 HEAD | grep -qx CHANGELOG.md \
               && ! git diff --name-only --diff-filter=D HEAD^1 HEAD | grep -q '^changelog\.d/'; then
              echo "::error file=CHANGELOG.md::Do not edit CHANGELOG.md in a normal PR. Move your entry into a new file: tools/changelog.sh new short-slug \"Title\" (see changelog.d/README.md). Editing CHANGELOG.md makes every other open PR conflict."
              exit 1
            fi
          fi
      - name: Does this change touch anything besides documents?
        id: diff
        run: |
          code=true
          if [ "${{ github.event_name }}" = pull_request ]; then
            # a pull request is checked out as GitHub's test merge: parent 1 is main, so this is the PR's whole change
            files="$(git diff --name-only HEAD^1 HEAD)"
            echo "$files"
            if [ -n "$files" ] && ! echo "$files" | grep -vqE '(\.md$|^docs/)'; then code=false; fi
          fi
          echo "code=$code" | tee -a "$GITHUB_OUTPUT"

  linux:
    name: Linux build, selftest, fuzz
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake g++ libsdl2-dev libasound2-dev
      - name: Build (all targets, any warning in our code is an error)
        run: |
          cmake -S . -B build-x86_64 -DCMAKE_BUILD_TYPE=Release -DT8_WERROR=ON -DT8_WARNINGS_AS_ERRORS=ON
          cmake --build build-x86_64 -j"$(nproc)"
      - name: t8_selftest
        run: tools/run_tests.sh build-x86_64 selftest
      - name: t8_fuzz --seeds 30
        run: tools/run_tests.sh build-x86_64 fuzz --seeds 30
      - name: Tests left no files in the repo
        run: |
          if [ -n "$(git status --porcelain --ignored -- . ':!build-x86_64')" ]; then
            git status --porcelain --ignored -- . ':!build-x86_64'; echo "tests wrote files into the repo"; exit 1
          fi

  sanitizers:
    name: Memory and undefined-behaviour check (ASan + UBSan)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ASAN_OPTIONS: detect_leaks=1:abort_on_error=1
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake g++ libsdl2-dev libasound2-dev
      - name: Build t8_selftest and t8_fuzz with sanitizers
        run: |
          cmake -S . -B build-asan -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_CXX_FLAGS_RELWITHDEBINFO="-O1 -g" -DT8_SANITIZE=address,undefined -DT8_WERROR=ON
          cmake --build build-asan --target t8_selftest t8_fuzz -j"$(nproc)"
      - name: t8_selftest (sanitizers)
        run: tools/run_tests.sh build-asan selftest
      - name: t8_fuzz --seeds 10 (sanitizers)
        run: tools/run_tests.sh build-asan fuzz --seeds 10

  threads:
    name: Thread race check (TSan)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TSAN_OPTIONS: halt_on_error=1:second_deadlock_stack=1
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake g++ libsdl2-dev libasound2-dev
      - name: Build t8_fuzz with ThreadSanitizer
        run: |
          cmake -S . -B build-tsan -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_CXX_FLAGS_RELWITHDEBINFO="-O1 -g" -DT8_SANITIZE=thread
          cmake --build build-tsan --target t8_fuzz -j"$(nproc)"
      - name: t8_fuzz --threads (TSan)
        # setarch -R: newer Ubuntu kernels randomise memory in a way TSan cannot handle
        run: setarch "$(uname -m)" -R tools/run_tests.sh build-tsan fuzz --threads --seeds 5

  macos:
    name: macOS build and selftest
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: brew install sdl2
      - name: Build (all targets, including the app; any warning in our code is an error)
        run: |
          cmake -S . -B build-mac -DCMAKE_BUILD_TYPE=Release -DT8_WERROR=ON -DT8_WARNINGS_AS_ERRORS=ON
          cmake --build build-mac -j"$(sysctl -n hw.ncpu)"
      - name: t8_selftest
        run: tools/run_tests.sh build-mac selftest
